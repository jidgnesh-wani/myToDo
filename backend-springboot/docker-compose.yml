services:
  backend:
    build: .
    ports:
      - "5555:5555"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/todo.db
      # Add LAN hostnames here if you open the web UI from other machines
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: "http://localhost:*,http://127.0.0.1:*"
    volumes:
      - todo_data:/data
    restart: unless-stopped

volumes:
  todo_data:
