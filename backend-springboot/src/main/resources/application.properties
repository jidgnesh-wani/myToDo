spring.application.name=todo
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:sqlite:./todo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.resources.static-locations=classpath:/static/
# Active profile: dev (local) or prod (production)
# spring.profiles.active=dev
# spring.profiles.active=prod
server.port=8000

# logging.level.root=WARN
# logging.level.org.springframework.web=INFO

# Comma-separated CORS origin patterns (browser clients only; Android is unaffected)
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
